# Kifaa Community Edition — Nginx reverse proxy
# HTTP → HTTPS redirect. Agent endpoints exempt (agents use plain HTTP by default).
# Replace SERVER_NAME with your IP or domain name.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP ──────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 500M;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Agent heartbeat endpoints — stay on HTTP so agents don't need to trust certs
    set $api_upstream http://api:8000;
    location /api/v1/agents/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Agent binary downloads — served over HTTP for bootstrapping
    location /downloads/ {
        alias       /usr/share/nginx/html/downloads/;
        autoindex   off;
        add_header  Content-Disposition "attachment";
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/certs/kifaa.crt;
    ssl_certificate_key /etc/nginx/ssl/private/kifaa.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 500M;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # API + WebSocket (SSH terminal)
    set $api_upstream http://api:8000;
    location /api/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Agent binary downloads
    location /downloads/ {
        alias       /usr/share/nginx/html/downloads/;
        autoindex   off;
        add_header  Content-Disposition "attachment";
    }

    # React frontend (SPA — all unmatched paths go to index.html)
    set $frontend_upstream http://frontend:80;
    location / {
        proxy_pass         $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_intercept_errors off;
    }
}
