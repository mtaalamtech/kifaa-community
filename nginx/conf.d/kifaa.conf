# kifaa.kenyanut.com — nginx reverse proxy
# HTTP-only mode (no TLS). Enable the HTTPS block below once a certificate is installed.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── HTTP ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name kifaa.kenyanut.com 192.168.0.64 192.168.0.7 localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 500M;

    set $api_upstream http://api:8000;

    # Let's Encrypt ACME HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # API (including WebSocket for SSH/RDP terminal)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # Agent binary downloads
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    # Deployed packages
    location /deploy-packages/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Bot service
    set $bot_upstream http://kifaa-bot:8001;
    location /bot/ {
        proxy_pass $bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # Frontend (React SPA)
    set $frontend_upstream http://frontend:80;
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

# ─── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name kifaa.kenyanut.com 192.168.0.7 localhost;

    ssl_certificate     /etc/nginx/ssl/certs/kifaa.crt;
    ssl_certificate_key /etc/nginx/ssl/private/kifaa.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow larger uploads for software deploy packages
    client_max_body_size 500M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://kifaa.kenyanut.com; font-src 'self' data:; object-src 'none'; frame-ancestors 'self';" always;

    # ── API (including WebSocket for SSH/RDP terminal) ─────────────────────────
    set $api_upstream http://api:8000;
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # ── Deployed packages ─────────────────────────────────────────────────────
    location /deploy-packages/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Agent downloads — autoindex OFF (security: M5) ────────────────────────
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    # ── Bot service ───────────────────────────────────────────────────────────
    set $bot_upstream http://kifaa-bot:8001;
    location /bot/ {
        proxy_pass $bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # ── Frontend (React SPA) ──────────────────────────────────────────────────
    set $frontend_upstream http://frontend:80;
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
